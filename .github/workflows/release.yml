name: Release & CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    name: Audit, Lint & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wild linker
        run: |
          curl -sSL https://github.com/wild-linker/wild/releases/download/0.10.0/wild-linker-0.10.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xzf - --strip-components=1 -C /usr/local/bin wild-linker-0.10.0-x86_64-unknown-linux-gnu/wild
          sudo chmod +x /usr/local/bin/wild
          wild --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-19
          components: clippy, rustfmt, rustc-codegen-cranelift

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  build-release:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install wild linker
        run: |
          curl -sSL https://github.com/wild-linker/wild/releases/download/0.10.0/wild-linker-0.10.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xzf - --strip-components=1 -C /usr/local/bin wild-linker-0.10.0-x86_64-unknown-linux-gnu/wild
          sudo chmod +x /usr/local/bin/wild
          wild --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-19
          components: rustc-codegen-cranelift

      - name: Build release binary
        run: cargo build --release

      - name: Package release assets
        run: |
          PKG_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="openrouter-free-gateway") | "v" + .version')
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="$PKG_VERSION"
          fi

          echo "Packaging version: ${VERSION}"
          sha256sum target/release/openrouter-free-gateway > target/release/openrouter-free-gateway.sha256

          ARCHIVE_NAME="openrouter-free-gateway-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" -C target/release openrouter-free-gateway
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-free-gateway-linux-x86_64
          path: |
            target/release/openrouter-free-gateway
            target/release/openrouter-free-gateway.sha256

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/openrouter-free-gateway
            target/release/openrouter-free-gateway.sha256
            openrouter-free-gateway-*-x86_64-unknown-linux-gnu.tar.gz
            openrouter-free-gateway-*-x86_64-unknown-linux-gnu.tar.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
